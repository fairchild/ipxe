# The display stack this overlay boots with.
#
# Built by discovery/build-display-bundle.sh, published to the boot bucket, and
# named for the lock that produced it. The hash is the whole trust story: the
# bundle arrives over the same channel as everything else this node fetches, so
# what makes it safe to execute is that these bytes were pinned here, in the
# overlay, at build time.
#
# Changing the bundle means changing both lines together. frame-display treats
# a hash mismatch as fatal and retries rather than installing what it got.

